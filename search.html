<body>
<a class="skip-link" href="#main">پرش به محتوا</a>
<div class="page-wrapper">
  <input type="checkbox" id="menu-toggle" class="sr-only" aria-label="باز و بسته کردن منو">
  <header class="site-header">
    <div class="header-search" id="headerSearch">
      <div class="header-actions">
        <label for="menu-toggle" class="hamburger">
          <span class="hamburger__bar"></span>
          <span class="hamburger__bar"></span>
          <span class="hamburger__bar"></span>
        </label>
      </div>
      <form action="https://blunder.ir/search" method="get" class="header-search-form" role="search" aria-label="جستجوی سایت">
        <div class="live-search-wrapper">
          <label for="liveSearchHeader" class="sr-only">جستجو</label>
          <input type="search" id="liveSearchHeader" name="q" class="live-search-input" placeholder="جستجو..." autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search" aria-controls="postsList" aria-describedby="searchStatus">
          <button type="button" id="headerSearchClearBtn" class="search-clear-btn" aria-label="پاک کردن جستجو" hidden>
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <button type="submit" class="sr-only">جستجو</button>
      </form>
    </div>
  </header>
  <nav class="mobile-nav" aria-label="منوی اصلی">
    <ul role="list">
      <li><a href="https://blunder.ir/">صفحه اصلی</a></li>
      <li><a href="https://blunder.ir/blog">وبلاگ بلاندر</a></li>
    </ul>
  </nav>
  <main id="main" class="main-content" tabindex="-1">
    <h1 class="sr-only">جستجو در بلاندر</h1>
    <ul class="posts-list" id="postsList" role="list" aria-label="نتایج جستجو"></ul>
    <p class="posts-empty" id="postsEmpty">برای شروع، عبارت مورد نظر خود را در کادر جستجوی بالا وارد کنید.</p>
    <div id="searchStatus" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  </main>
</div>
<script type="application/json" id="postsData">
[
{%- for post in site.posts -%}
{"title":{{ post.title | jsonify | replace: '<', '\u003C' }},"url":{{ post.url | relative_url | jsonify | replace: '<', '\u003C' }}}{%- unless forloop.last -%},{%- endunless -%}
{%- endfor -%}
]
</script>
<script>
(function () {
  'use strict';

  var byId = function (id) { return document.getElementById(id); };

  var searchInput = byId('liveSearchHeader');
  var clearBtn = byId('headerSearchClearBtn');
  var postsList = byId('postsList');
  var postsEmpty = byId('postsEmpty');
  var searchStatus = byId('searchStatus');
  var menuToggle = byId('menu-toggle');
  var searchForm = document.querySelector('.header-search-form');

  var debounceTimer = null;
  var statusTimer = null;
  var DEBOUNCE_MS = 200;
  var postsCache = null;

  function getQueryParamQ() {
    var search = window.location.search || '';
    if (typeof URLSearchParams === 'function') {
      try {
        return new URLSearchParams(search).get('q') || '';
      } catch (err) {}
    }
    var raw = search.charAt(0) === '?' ? search.slice(1) : search;
    if (!raw) return '';
    var parts = raw.split('&');
    for (var i = 0; i < parts.length; i++) {
      var eq = parts[i].indexOf('=');
      var key = eq === -1 ? parts[i] : parts[i].slice(0, eq);
      if (key === 'q') {
        var val = eq === -1 ? '' : parts[i].slice(eq + 1).replace(/\+/g, ' ');
        try {
          return decodeURIComponent(val);
        } catch (err) {
          return val;
        }
      }
    }
    return '';
  }

  function setUrlQuery(q) {
    if (!window.history || typeof window.history.replaceState !== 'function') return;
    try {
      if (typeof URL === 'function') {
        var url = new URL(window.location.href);
        if (q) {
          url.searchParams.set('q', q);
        } else {
          url.searchParams.delete('q');
        }
        window.history.replaceState({}, '', url.toString());
        return;
      }
    } catch (err) {}

    try {
      var loc = window.location;
      var base = loc.pathname;
      var nextQuery = q ? ('?q=' + encodeURIComponent(q)) : '';
      window.history.replaceState({}, '', base + nextQuery + (loc.hash || ''));
    } catch (err) {}
  }

  function foldChar(ch) {
    var c = ch.charCodeAt(0);
    if (c >= 0x06F0 && c <= 0x06F9) return String.fromCharCode(c - 0x06F0 + 48);
    if (c >= 0x0660 && c <= 0x0669) return String.fromCharCode(c - 0x0660 + 48);
    if (c === 0x064A || c === 0x0649 || c === 0x06CC || c === 0x0626) return '\u06CC';
    if (c === 0x0643 || c === 0x06A9) return '\u06A9';
    if (c === 0x0623 || c === 0x0625 || c === 0x0622 || c === 0x0671) return '\u0627';
    if (c === 0x0629) return '\u0647';
    if (c === 0x0624) return '\u0648';
    if (c >= 0x064B && c <= 0x0652) return '';
    if (c === 0x0640 || c === 0x200C || c === 0x200D || c === 0x200E || c === 0x200F) return '';
    if (c === 32 || c === 9 || c === 10 || c === 13 || c === 0x00A0) return '';
    var lower = ch.toLowerCase();
    return lower.length === 1 ? lower : ch;
  }

  function fold(s) {
    s = String(s);
    var out = '';
    for (var i = 0; i < s.length; i++) {
      out += foldChar(s.charAt(i));
    }
    return out;
  }

  function getPosts() {
    if (postsCache !== null) return postsCache;

    var arr = [];
    var el = byId('postsData');

    if (el) {
      try {
        var parsed = JSON.parse(el.textContent);
        if (Array.isArray(parsed)) {
          for (var i = 0; i < parsed.length; i++) {
            var p = parsed[i];
            if (p && typeof p.title === 'string' && typeof p.url === 'string' && p.title && p.url) {
              arr.push({ title: p.title, url: p.url, folded: fold(p.title) });
            }
          }
        }
      } catch (err) {}
      el.textContent = '';
    }

    postsCache = arr;
    return arr;
  }

  function announce(msg) {
    if (!searchStatus) return;
    clearTimeout(statusTimer);
    statusTimer = setTimeout(function () { searchStatus.textContent = msg; }, 300);
  }

  function createTextCard(post) {
    var a = document.createElement('a');
    a.href = post.url;
    a.className = 'post-card';
    var text = document.createElement('span');
    text.className = 'post-text';
    var title = document.createElement('span');
    title.className = 'post-title-text';
    title.textContent = post.title;
    text.appendChild(title);
    a.appendChild(text);
    return a;
  }

  function renderList(term) {
    var normalizedTerm = fold(term);

    if (postsList) {
      postsList.innerHTML = '';
    }

    if (!normalizedTerm) {
      if (postsEmpty) {
        postsEmpty.textContent = 'برای شروع، عبارت مورد نظر خود را در کادر جستجوی بالا وارد کنید.';
        postsEmpty.hidden = false;
      }
      setUrlQuery('');
      announce('');
      return;
    }

    var allPosts = getPosts();
    var filtered = [];

    for (var i = 0; i < allPosts.length; i++) {
      if (allPosts[i].folded.indexOf(normalizedTerm) !== -1) {
        filtered.push(allPosts[i]);
      }
    }

    if (filtered.length === 0) {
      if (postsEmpty) {
        postsEmpty.textContent = 'هیچ مطلبی یافت نشد.';
        postsEmpty.hidden = false;
      }
      setUrlQuery(term);
      announce('نتیجه‌ای یافت نشد');
      return;
    }

    if (postsEmpty) {
      postsEmpty.hidden = true;
    }

    var fragment = document.createDocumentFragment();

    for (var k = 0; k < filtered.length; k++) {
      var item = filtered[k];
      var li = document.createElement('li');
      li.appendChild(createTextCard(item));
      fragment.appendChild(li);
    }

    if (postsList) {
      postsList.appendChild(fragment);
    }

    setUrlQuery(term);
    announce(filtered.length + ' نتیجه یافت شد');
  }

  if (searchForm) {
    searchForm.addEventListener('submit', function (e) {
      if (e && typeof e.preventDefault === 'function') e.preventDefault();
      if (searchInput) {
        renderList(searchInput.value);
      }
    });
  }

  if (searchInput) {
    searchInput.addEventListener('input', function () {
      clearTimeout(debounceTimer);
      var val = searchInput.value;
      debounceTimer = setTimeout(function () {
        renderList(val);
      }, DEBOUNCE_MS);
      if (clearBtn) {
        clearBtn.hidden = val === '';
      }
    });
  }

  if (clearBtn) {
    clearBtn.addEventListener('click', function () {
      if (!searchInput) return;
      searchInput.value = '';
      searchInput.focus();
      clearBtn.hidden = true;
      renderList('');
    });
  }

  if (menuToggle) {
    menuToggle.addEventListener('change', function () {
      document.documentElement.classList.toggle('nav-open', menuToggle.checked);
    });
  }

  document.addEventListener('keydown', function (e) {
    if (e.isComposing) return;
    if (e.key !== 'Escape' && e.key !== 'Esc') return;
    if (menuToggle && menuToggle.checked) {
      menuToggle.checked = false;
      document.documentElement.classList.remove('nav-open');
    }
  });

  var navLinks = document.querySelectorAll('.mobile-nav a');
  for (var n = 0; n < navLinks.length; n++) {
    navLinks[n].addEventListener('click', function () {
      if (menuToggle) {
        menuToggle.checked = false;
      }
      document.documentElement.classList.remove('nav-open');
    });
  }

  var initialQuery = getQueryParamQ();

  if (initialQuery) {
    if (searchInput) {
      searchInput.value = initialQuery;
    }
    if (clearBtn) {
      clearBtn.hidden = false;
    }
    renderList(initialQuery);
  } else {
    if (postsEmpty) {
      postsEmpty.hidden = false;
    }
    if (searchInput) {
      searchInput.focus();
    }
  }
})();
</script>
</body>
</html>
