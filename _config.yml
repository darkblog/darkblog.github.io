# Site identity
url: "https://www.pasgah.org"
baseurl: ""
lang: fa
timezone: Asia/Tehran
encoding: UTF-8

# Permalinks
permalink: /blog/:title

# Markdown
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "default"
      author: "احسان چهری"

# Future posts
future: false

# Build behavior
strict_front_matter: false
incremental: false
